<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>আত্মশুদ্ধি হিসাব</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f1;--card:#fff;--ink:#14282a;--mute:#5d7274;--line:#d3dedc;--fine:#b3382c;--gain:#1b7a55;--accent:#0f4c4a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1a1b;--card:#15292a;--ink:#e6f0ee;--mute:#8fa8a6;--line:#264041;--fine:#ef8174;--gain:#5fd1a0;--accent:#7fd0c8}}
:root[data-theme="dark"]{--bg:#0d1a1b;--card:#15292a;--ink:#e6f0ee;--mute:#8fa8a6;--line:#264041;--fine:#ef8174;--gain:#5fd1a0;--accent:#7fd0c8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hind Siliguri",system-ui,sans-serif;line-height:1.5}
main{max-width:520px;margin:0 auto;padding:16px}
.sum{background:var(--accent);color:var(--bg);border-radius:18px;padding:20px}
.sum small{opacity:.85}
.net{font-size:44px;font-weight:700;line-height:1.1}
.row{display:flex;gap:10px;margin-top:12px}
.row div{flex:1;background:rgba(255,255,255,.14);border-radius:12px;padding:8px 12px;font-size:14px}
.row b{display:block;font-size:20px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-top:16px}
.sh{display:flex;align-items:center;gap:8px}
.sh h3{flex:1;margin:0;font-size:18px}
.sub{font-weight:700;font-size:15px}
.rule{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding:9px 0}
.rule .n{flex:1}
.amt{font-weight:700}
.fine .amt{color:var(--fine)}.gain .amt{color:var(--gain)}
button{font:inherit;cursor:pointer}
.add{border:0;border-radius:10px;padding:7px 14px;color:#fff;font-weight:500}
.fine .add{background:var(--fine)}.gain .add{background:var(--gain)}
.ic{background:none;border:0;color:var(--mute);padding:4px 6px;font-size:14px}
.link{background:none;border:0;color:var(--mute);text-decoration:underline;padding:6px 0}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
details{margin-top:6px}
summary{cursor:pointer;color:var(--accent);font-size:14px;padding:4px 0}
form.nr{display:grid;grid-template-columns:1fr 80px;gap:8px;margin-top:6px}
input,select{font:inherit;padding:9px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-width:0}
.go{grid-column:1/-1;background:var(--accent);color:var(--bg);border:0;border-radius:10px;padding:9px}
.hist{font-size:14px;display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
h2{font-size:17px;margin:24px 0 6px}
.sm{display:grid;grid-template-columns:1.45fr 1fr;gap:10px;margin-top:10px;align-items:start}.rt{display:grid;gap:8px}.rt .it{background:rgba(255,255,255,.14);border-radius:12px;padding:8px 12px}.rt small{display:block;font-size:13px}.rt b{font-size:20px}.bs{display:grid;gap:8px}.bs .it div{flex-wrap:wrap;gap:4px 12px}.bs .it{background:rgba(255,255,255,.14);border-radius:12px;padding:8px 12px}.bs .it strong{display:block;font-size:15px}.bs .it div{display:flex;gap:16px;font-size:14px}.bs .it b{font-size:16px}.vt{display:flex;gap:6px;margin-top:8px;align-items:center}.vt button{background:rgba(255,255,255,.18);color:inherit;border:0;border-radius:10px;padding:6px 14px;font:inherit}.vt button.on{background:var(--bg);color:var(--accent);font-weight:700}.vt input{margin-left:auto;background:rgba(255,255,255,.18);color:inherit;border:0;padding:5px 6px;border-radius:10px;max-width:150px;font:inherit;font-size:14px}.mn{display:flex;align-items:center;justify-content:space-between;margin:6px 0 2px}.mn strong{font-size:18px}.mn button{background:rgba(255,255,255,.18);color:inherit;border:0;border-radius:10px;width:40px;height:36px;font-size:22px}.mn button:disabled{opacity:.3}.er{display:grid;grid-template-columns:1fr 80px;gap:6px;border-top:1px solid var(--line);padding:9px 0}.er .dl{text-align:right;align-self:center}.yes2{color:var(--accent);font-weight:700}.ps{display:flex;gap:8px;margin:8px 0}.ps div{flex:1;border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:13px}.ps b{display:block;font-size:19px}.due{color:var(--fine)}.ok{color:var(--gain)}.pl{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;padding:6px 0;border-top:1px solid var(--line)}.pf{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.pf button{border:0;border-radius:10px;padding:9px;font-weight:500}.pf .p1{background:var(--gain);color:#fff}.pf .p2{background:none;border:1px solid var(--line);color:var(--ink)}.note{font-size:13px;color:var(--mute)}.yes{color:var(--fine);font-weight:700}
.newsec{display:flex;gap:8px;margin-top:16px}
.newsec input{flex:1}
.newsec button{background:var(--accent);color:var(--bg);border:0;border-radius:10px;padding:0 16px}
</style>
</head>
<body>
<main>
<div class="sum">
  <small id="today"></small>
  <div class="vt"><button type="button" data-vm="month" id="vbM">মাস</button><button type="button" data-vm="day" id="vbD">দিন</button><input type="date" id="dp" aria-label="তারিখ বেছে নিন"></div>
  <div class="mn"><button type="button" data-mm="-1" aria-label="আগের মাস">‹</button><strong id="mlab"></strong><button type="button" data-mm="1" id="mnext" aria-label="পরের মাস">›</button></div>
  <div class="sm"><div class="bs" id="bs"></div><div class="rt"><div class="it"><small>বর্তমান বাকি</small><b id="dueS">৳০</b></div><div class="it"><small>মোট পরিশোধ</small><b id="paidS">৳০</b></div></div></div>
</div>

<div id="pay"></div>
<div id="secs"></div>

<form class="newsec" id="nsf">
  <input id="nsn" placeholder="নতুন সেকশনের নাম" required>
  <button type="submit">সেকশন যোগ</button>
</form>

<div id="bk"></div>
<button class="link" id="undo" type="button">শেষটা বাতিল করুন</button><br>
<button class="link" id="reset">সব মাসের হিসাব মুছুন</button>
<p class="note">জরিমানার টাকা আলাদা করে রেখে মাস শেষে সদকা করুন।</p>
</main>
<script>
const KEY="habit-fine-v2";
const R=(id,name,amt,type)=>({id,name,amt,type});
let S={sections:[
 {id:"s1",name:"দাড়ি",rules:[R("a1","একটি দাড়ি ছিঁড়লাম",10,"fine"),R("a2","মুখ থেকে দাড়ি তুললাম",20,"fine")]},
 {id:"s2",name:"নামাজ",rules:[R("b1","নামাজ কাজা হলো",50,"fine"),R("b2","একা নামাজ পড়লাম",5,"fine"),R("b3","জামাতে নামাজ পড়লাম",10,"gain")]},
 {id:"s3",name:"তেলাওয়াত",rules:[R("c1","তেলাওয়াত মিস হলো",10,"fine"),R("c2","তেলাওয়াত করলাম",10,"gain")]}
],log:[]};
try{const r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}
if(!S.pay)S.pay=[];
let UI={};
const MN=["জানুয়ারি","ফেব্রুয়ারি","মার্চ","এপ্রিল","মে","জুন","জুলাই","আগস্ট","সেপ্টেম্বর","অক্টোবর","নভেম্বর","ডিসেম্বর"];
const WD=["রবিবার","সোমবার","মঙ্গলবার","বুধবার","বৃহস্পতিবার","শুক্রবার","শনিবার"];
const now0=new Date();let VM={y:now0.getFullYear(),m:now0.getMonth(),d:0};
const inM=l=>{const d=new Date(l.t);return d.getFullYear()===VM.y&&d.getMonth()===VM.m&&(!VM.d||d.getDate()===VM.d)};
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const full=d=>WD[d.getDay()]+", "+bn(d.getDate())+" "+MN[d.getMonth()]+" "+bn(d.getFullYear());
const tm=d=>{let H=d.getHours(),p=H>=12?"PM":"AM";H=H%12||12;return bn(H)+":"+bn(String(d.getMinutes()).padStart(2,"0"))+" "+p};
let SYNC="off",LASTSYNC=0,REF=null,MSG="",pt=null;
const clr=()=>setTimeout(()=>{MSG="";render()},4000);
const save=()=>{S.updated=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}push()};
function push(){if(!REF)return;clearTimeout(pt);pt=setTimeout(async()=>{try{await REF.set({json:JSON.stringify(S),updated:S.updated});SYNC="on";LASTSYNC=Date.now()}catch(e){SYNC="err"}renderBk()},800)}
async function initSync(){try{
  if(typeof claude==="undefined")return;
  const user=await claude.use("user"),db=await claude.use("db");if(!user||!db)return;
  const id=await user.id();REF=db.collection("data/users/"+id).doc("tracker");
  const snap=await REF.get();
  if(snap.exists){const r=snap.data();
    if(r&&r.json&&(r.updated||0)>(S.updated||0)){S=JSON.parse(r.json);if(!S.pay)S.pay=[];try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}render()}else push()}
  else push();
  SYNC="on";
}catch(e){SYNC="err"}renderBk()}
function renderBk(){
  const code=UI.bkshow?`<textarea readonly rows="5" onclick="this.select()" style="width:100%;margin-top:8px;font-size:12px">${esc(JSON.stringify(S))}</textarea><p class="note">লেখার ওপর চাপুন, সব সিলেক্ট হবে। কপি করে Google Keep বা নোটে রেখে দিন।</p>`:"";
  $("bk").innerHTML=`<section class="sec"><div class="sh"><h3>ব্যাকআপ</h3></div><p class="note">হিসাব এই ব্রাউজারে সংরক্ষিত আছে। নিরাপত্তার জন্য মাঝে মাঝে ব্যাকআপ কোড কপি করে রাখুন।</p><div class="pf"><button class="p1" type="button" data-bk="${UI.bkshow?"hide":"show"}">${UI.bkshow?"কোড লুকান":"ব্যাকআপ কোড দেখান"}</button></div>${code}<textarea id="rtxt" rows="3" placeholder="ফিরিয়ে আনতে ব্যাকআপ কোড এখানে পেস্ট করুন" style="width:100%;margin-top:10px;font-size:12px"></textarea><div class="pf"><button class="p2" type="button" data-bk="restore">কোড থেকে ফিরিয়ে আনুন</button></div>`+(UI.del==="restore"?`<p class="note">বর্তমান সব হিসাব কোডের হিসাব দিয়ে বদলে যাবে। নিশ্চিত? <button class="ic yes" data-yes="restore">হ্যাঁ</button><button class="ic" data-no="1">না</button></p>`:"")+(MSG?`<p class="note">${esc(MSG)}</p>`:"")+`</section>`;
}

const bn=n=>String(n).replace(/\d/g,d=>"০১২৩৪৫৬৭৮৯"[d]);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=i=>document.getElementById(i);
const uid=()=>"i"+Date.now()+Math.floor(Math.random()*1000);
const net=l=>l.reduce((a,x)=>a+(x.type==="gain"?x.amt:-x.amt),0);
const money=n=>(n<0?"−":"")+"৳"+bn(Math.abs(n));
const sec=id=>S.sections.find(s=>s.id===id);
const ask=(key,yes)=>UI.del===key?`<span class="note">মুছবেন?</span><button class="ic yes" data-yes="${yes}">হ্যাঁ</button><button class="ic" data-no="1">না</button>`:null;
function renderPay(){
  const byM={};
  S.log.filter(l=>l.type==="fine").forEach(l=>{const d=new Date(l.t),k=d.getFullYear()*12+d.getMonth();byM[k]=(byM[k]||0)+l.amt});
  const F=Object.values(byM).reduce((a,x)=>a+x,0);
  const P=S.pay.reduce((a,x)=>a+x.amt,0);
  let rest=P;const dues=[];
  Object.keys(byM).map(Number).sort((a,b)=>a-b).forEach(k=>{const pd=Math.min(rest,byM[k]);rest-=pd;const du=byM[k]-pd;if(du>0)dues.push({k,du})});
  const D=Math.max(0,F-P),adv=Math.max(0,P-F);
  window.__due=D;
  $("dueS").textContent="৳"+bn(D);$("paidS").textContent="৳"+bn(P);
  const pays=S.pay.slice().sort((a,b)=>b.t-a.t).slice(0,6);
  $("pay").innerHTML=`<section class="sec"><div class="sh"><h3>পেমেন্ট ও বাকি</h3></div>
  <div class="ps"><div>মোট জরিমানা<b>৳${bn(F)}</b></div><div>পরিশোধ<b class="ok">৳${bn(P)}</b></div><div>বাকি<b class="${D>0?"due":"ok"}">৳${bn(D)}</b></div></div>`+
  (adv?`<p class="note">অগ্রিম জমা আছে ৳${bn(adv)}</p>`:"")+
  (dues.length?dues.map(x=>`<div class="pl"><span>${MN[x.k%12]} ${bn(Math.floor(x.k/12))}</span><b class="due">বাকি ৳${bn(x.du)}</b></div>`).join(""):'<p class="note">কোনো মাসের জরিমানা বাকি নেই।</p>')+
  `<form class="nr" id="payf" style="margin-top:10px"><input name="a" type="number" min="1" placeholder="কত টাকা পেমেন্ট করলেন" required><input name="n" placeholder="নোট (ঐচ্ছিক)"><button class="go" type="submit">পেমেন্ট হয়েছে</button></form>`+
  (D>0?`<div class="pf"><button type="button" class="p2" data-payall="1">সব বাকি একসাথে পরিশোধ (৳${bn(D)})</button></div>`:"")+
  (pays.length?`<p class="note" style="margin:12px 0 2px">সর্বশেষ পেমেন্ট</p>`+pays.map(x=>{const d=new Date(x.t);const del=UI.del==="p|"+x.id?`<span class="note">মুছবেন? <button class="ic yes" data-yes="p|${x.id}">হ্যাঁ</button><button class="ic" data-no="1">না</button></span>`:`<button class="ic" data-dp="${x.id}" aria-label="পেমেন্ট মুছুন">মুছুন</button>`;return `<div class="pl"><span>৳${bn(x.amt)} <small class="note">${full(d)}${x.note?" · "+esc(x.note):""}</small></span>${del}</div>`}).join(""):"")+
  `</section>`;
}
function render(){
  const L=S.log.filter(inM);
  const T=new Date();
  $("today").textContent="আজ: "+full(T);
  $("mlab").textContent=VM.d?full(new Date(VM.y,VM.m,VM.d)):MN[VM.m]+" "+bn(VM.y);
  const td=new Date(T.getFullYear(),T.getMonth(),T.getDate());
  $("mnext").disabled=VM.d?new Date(VM.y,VM.m,VM.d)>=td:(VM.y===T.getFullYear()&&VM.m===T.getMonth());
  $("vbM").className=VM.d?"":"on";$("vbD").className=VM.d?"on":"";
  $("dp").max=iso(T);$("dp").value=iso(VM.d?new Date(VM.y,VM.m,VM.d):T);
  $("bs").innerHTML=S.sections.map(s=>{
    const l=L.filter(x=>x.sid===s.id);
    const sf=l.filter(x=>x.type==="fine").reduce((a,x)=>a+x.amt,0);
    const sg=l.filter(x=>x.type==="gain").reduce((a,x)=>a+x.amt,0);
    return `<div class="it"><strong>${esc(s.name)}</strong><div><span>জরিমানা <b>৳${bn(sf)}</b></span><span>পুরস্কার <b>৳${bn(sg)}</b></span></div></div>`;
  }).join("");
  $("secs").innerHTML=S.sections.map(s=>{
    const sub=net(L.filter(l=>l.sid===s.id));
    const ed=UI.edit===s.id;
    const opt=t=>`<option value="fine"${t==="fine"?" selected":""}>জরিমানা</option><option value="gain"${t==="gain"?" selected":""}>পুরস্কার</option>`;
    if(!ed){
      return `<section class="sec"><div class="sh"><h3>${esc(s.name)}</h3><span class="sub" style="color:var(--${sub<0?"fine":"gain"})">${money(sub)}</span><button class="ic" data-edit="${s.id}" aria-label="${esc(s.name)} সম্পাদনা">✎</button></div>`+
      s.rules.map(r=>`<div class="rule ${r.type}"><span class="n">${esc(r.name)}</span><span class="amt">${r.type==="fine"?"−":"+"}৳${bn(r.amt)}</span><button class="add" data-add="${s.id}|${r.id}">যোগ</button></div>`).join("")+
      (s.rules.length?"":'<p class="note">কোনো শর্ত নেই। ✎ চেপে যোগ করুন।</p>')+`</section>`;
    }
    const delS=UI.del==="s|"+s.id?`<span class="note">সেকশন মুছবেন?</span><button class="ic yes" data-yes="s|${s.id}">হ্যাঁ</button><button class="ic" data-no="1">না</button>`:`<button class="ic yes" data-ds="${s.id}">সেকশন মুছুন</button>`;
    return `<section class="sec editing"><div class="sh"><input data-sn="${s.id}" value="${esc(s.name)}" aria-label="সেকশনের নাম" style="flex:1;font-weight:700"><button class="ic yes2" data-done="1">সম্পন্ন</button></div>`+
    s.rules.map(r=>{const k=s.id+"|"+r.id;
      const del=UI.del==="r|"+k?`<span class="note">মুছবেন? <button class="ic yes" data-yes="r|${k}">হ্যাঁ</button><button class="ic" data-no="1">না</button></span>`:`<button class="ic yes" data-dr="${k}" aria-label="শর্ত মুছুন">মুছুন</button>`;
      return `<div class="er"><input data-rf="${k}|n" value="${esc(r.name)}" aria-label="শর্তের নাম"><input data-rf="${k}|a" type="number" min="1" value="${r.amt}" aria-label="টাকা"><select data-rf="${k}|t">${opt(r.type)}</select><div class="dl">${del}</div></div>`}).join("")+
    `<form class="nr" data-form="${s.id}" style="border-top:1px solid var(--line);padding-top:10px;margin-top:6px"><input name="n" placeholder="নতুন শর্ত, যেমন: ফজর কাজা" required><input name="a" type="number" min="1" placeholder="টাকা" required><select name="t" style="grid-column:1/-1">${opt("fine")}</select><button class="go" type="submit">শর্ত যোগ করুন</button></form>`+
    `<div style="margin-top:8px">${delS}</div></section>`;
  }).join("");
  renderPay();renderBk();
  $("reset").outerHTML=UI.del==="reset"?`<span id="reset" class="note">সব মাসের সব হিসাব মুছবেন? <button class="ic yes" data-yes="reset">হ্যাঁ</button><button class="ic" data-no="1">না</button></span>`:`<button class="link" id="reset" data-rst="1">সব মাসের হিসাব মুছুন</button>`;
  const last=S.log[S.log.length-1];
  $("undo").textContent=last?"শেষ এন্ট্রি বাতিল করুন ("+last.name+")":"বাতিল করার মতো কিছু নেই";
  $("undo").disabled=!last;
}
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;const d=b.dataset;const E=UI.edit;
  if(d.mm){const n=+d.mm;if(VM.d){const dt=new Date(VM.y,VM.m,VM.d+n);VM={y:dt.getFullYear(),m:dt.getMonth(),d:dt.getDate()}}else{VM.m+=n;if(VM.m<0){VM.m=11;VM.y--}if(VM.m>11){VM.m=0;VM.y++}}}
  else if(d.vm){const T=new Date();VM=d.vm==="day"?{y:VM.y,m:VM.m,d:VM.d||((VM.y===T.getFullYear()&&VM.m===T.getMonth())?T.getDate():1)}:{y:VM.y,m:VM.m,d:0}}
  else if(d.bk==="show")UI={bkshow:1};
  else if(d.bk==="hide")UI={};
  else if(d.bk==="restore"){try{const o=JSON.parse($("rtxt").value.trim());if(!Array.isArray(o.sections)||!Array.isArray(o.log))throw 0;window.__pend=o;UI={del:"restore"}}catch(er){MSG="কোডটি সঠিক নয়";clr()}}
  else if(d.add){const[si,ri]=d.add.split("|");const s=sec(si),r=s.rules.find(x=>x.id===ri);{const T=new Date();VM={y:T.getFullYear(),m:T.getMonth(),d:VM.d?T.getDate():0}}S.log.push({sid:si,sec:s.name,name:r.name,amt:r.amt,type:r.type,t:Date.now()});save()}
  else if(d.edit)UI={edit:d.edit};
  else if(d.done)UI={};
  else if(d.dr)UI={edit:E,del:"r|"+d.dr};
  else if(d.ds)UI={edit:E,del:"s|"+d.ds};
  else if(d.rst)UI={del:"reset"};
  else if(d.dp)UI={edit:E,del:"p|"+d.dp};
  else if(d.payall){if(window.__due>0){S.pay.push({id:uid(),amt:window.__due,t:Date.now(),note:"সব বাকি"});save()}}
  else if(d.no)UI={edit:E};
  else if(d.yes){
    const[t,x,y]=d.yes.split("|");
    if(t==="r"){const s=sec(x);s.rules=s.rules.filter(r=>r.id!==y);UI={edit:E}}
    else if(t==="s"){S.sections=S.sections.filter(s=>s.id!==x);UI={}}
    else if(t==="p"){S.pay=S.pay.filter(p=>p.id!==x);UI={edit:E}}
    else if(t==="reset"){S.log=[];S.pay=[];UI={}}
    else if(t==="restore"&&window.__pend){S=window.__pend;if(!S.pay)S.pay=[];UI={};MSG="হিসাব ফিরিয়ে আনা হয়েছে";clr()}
    save();
  } else if(b.id==="undo"){S.log.pop();save()}
  else return;
  render();
});
document.addEventListener("change",e=>{
  const t=e.target,d=t.dataset;
  if(t.id==="dp"){if(t.value){const[y,m,dd]=t.value.split("-").map(Number);VM={y,m:m-1,d:dd};render()}return}
  if(t.id==="bkf"){const f=t.files&&t.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const o=JSON.parse(rd.result);if(!Array.isArray(o.sections)||!Array.isArray(o.log))throw 0;window.__pend=o;UI={del:"restore"}}catch(er){MSG="ফাইলটি সঠিক ব্যাকআপ ফাইল নয়";clr()}render()};rd.readAsText(f);return}
  if(d.sn){const s=sec(d.sn);s.name=t.value.trim()||s.name;save()}
  else if(d.rf){const[si,ri,f]=d.rf.split("|");const r=sec(si).rules.find(x=>x.id===ri);
    if(f==="n")r.name=t.value.trim()||r.name;
    else if(f==="a")r.amt=Math.abs(+t.value)||r.amt;
    else r.type=t.value;
    save()}
});
document.addEventListener("submit",e=>{
  e.preventDefault();const f=e.target;
  if(f.dataset.form){sec(f.dataset.form).rules.push(R(uid(),f.n.value.trim(),Math.abs(+f.a.value),f.t.value))}
  else if(f.dataset.erule){const[si,ri]=f.dataset.erule.split("|");const r=sec(si).rules.find(x=>x.id===ri);r.name=f.n.value.trim()||r.name;r.amt=Math.abs(+f.a.value)||r.amt;r.type=f.t.value;UI={}}
  else if(f.dataset.esec){sec(f.dataset.esec).name=f.n.value.trim()||sec(f.dataset.esec).name;UI={}}
  else if(f.id==="payf"){const a=Math.abs(+f.a.value);if(a)S.pay.push({id:uid(),amt:a,t:Date.now(),note:f.n.value.trim()})}
  else if(f.id==="nsf"){S.sections.push({id:uid(),name:$("nsn").value.trim(),rules:[]});f.reset()}
  save();render();
});
render();
</script>
</body>
</html>
